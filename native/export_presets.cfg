[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/dinosaurs/regular-layout.json,payload/dinosaurs/*.dat,assets/hud-modular/*.json,assets/hud-modular/plates/*/theme.json,assets/blocks/*.bin,assets/*.json,assets/kael-slam-0111/frames.json,assets/hero-attacks-0111/frames.json,assets/voices/manifest.json"
exclude_filter="payload/dinosaurs/scene-*.dat,assets/dinosaurs/frames/*,assets/dinosaurs/*-source.png,assets/dinosaurs/*prompts*.json,tests/*,build/*,tools/*,*.md,*.ps1,assets/hud-modular/plates/*/source-sheet.png,assets/hud-modular/plates/*/shell-source.png,assets/hud-modular/plates/portraits-source.png,assets/hud-modular/plates/prompts.json,assets/hud-modular/plates/shell-prompts.json,assets/hud-modular/plates/portraits-source.json,assets/hud-modular/plates/menu-prompts.json,assets/hud-modular/plates/*/menu-source.png,branding/*,assets/minions-individual-v2/*,assets/minions-bound/*"
export_path="build/release-0.14.1/Extinction Protocol.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug="../tools/templates/windows_debug_x86_64.exe"
custom_template/release="../tools/templates/windows_release_x86_64.exe"
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/product_name="Extinction Protocol"
application/file_description="Extinction Protocol - native survivor roguelite"
application/file_version="0.14.1.0"
application/product_version="0.14.1.0"

